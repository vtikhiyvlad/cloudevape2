<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CloudVape{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    {% if user %}
    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-6">
            <a href="/" class="text-xl font-bold tracking-tight">CloudVape</a>
            <a href="/stores" class="text-gray-300 hover:text-white text-sm">Магазины</a>
            <a href="/products" class="text-gray-300 hover:text-white text-sm">Товары</a>
            <a href="/sellers" class="text-gray-300 hover:text-white text-sm">Продавцы</a>
            <a href="/sales" class="text-gray-300 hover:text-white text-sm">Продажи</a>
            <a href="/sell" class="text-gray-300 hover:text-white text-sm">Касса</a>
            <a href="/inventory" class="text-gray-300 hover:text-white text-sm">Инвентаризации</a>
            <a href="/inventory/my" class="text-gray-300 hover:text-white text-sm">Мой учёт</a>
            <a href="/warehouse" class="text-gray-300 hover:text-white text-sm">Склады</a>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <span class="text-gray-400">{{ user.full_name or user.username }}</span>
            <a href="/settings" class="text-gray-300 hover:text-white text-sm">Настройки</a>
            <a href="/logout" class="text-red-400 hover:text-red-300">Выйти</a>
        </div>
    </nav>
    {% endif %}

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% if error %}
        <div class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded mb-6">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="bg-green-100 border border-green-300 text-green-800 px-4 py-3 rounded mb-6">{{ success }}</div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
