{% extends "base.html" %}
{% block title %}Вход — CloudVape{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-2">CloudVape</h1>
        <p class="text-gray-500 text-center mb-8 text-sm">CRM для вейп-шопов</p>

        {% if error %}
        <div class="bg-red-50 text-red-700 text-sm px-4 py-3 rounded mb-6">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Логин</label>
                <input type="text" name="username" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
                       placeholder="owner" value="owner">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" name="password" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
                       placeholder="••••••••">
            </div>
            <button type="submit"
                    class="w-full bg-slate-900 text-white py-2.5 rounded-lg font-medium hover:bg-slate-800 transition">
                Войти
            </button>
        </form>
    </div>
</div>
{% endblock %}
