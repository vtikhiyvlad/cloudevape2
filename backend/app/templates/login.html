{% extends "base.html" %}
{% block title %}Вход — CloudVape{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 space-y-6">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-2">CloudVape</h1>
        <p class="text-gray-500 text-center mb-6 text-sm">CRM для вейп-шопов</p>

        {% if error %}
        <div class="bg-red-50 text-red-700 text-sm px-4 py-3 rounded mb-4">{{ error }}</div>
        {% endif %}

        <div class="mb-6 pb-6 border-b">
            <h2 class="font-semibold mb-2 text-center">Вход через Telegram</h2>
            <p class="text-xs text-gray-500 text-center mb-3">
                В боте нажми «🌐 Вход на сайт» → получи код → введи сюда
            </p>
            <form method="post" action="/login/telegram" class="space-y-3">
                <input type="text" name="code" required maxlength="6" pattern="[0-9]{6}"
                       placeholder="Код из бота (6 цифр)"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-slate-500">
                <button type="submit"
                        class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700">
                    Войти по коду
                </button>
            </form>
        </div>

        <h2 class="font-semibold mb-3 text-center text-sm text-gray-500">Или логин / пароль (владелец)</h2>
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Логин</label>
                <input type="text" name="username" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
                       placeholder="owner">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" name="password" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500">
            </div>
            <button type="submit"
                    class="w-full bg-slate-900 text-white py-2.5 rounded-lg font-medium hover:bg-slate-800">
                Войти
            </button>
        </form>
    </div>
</div>
{% endblock %}
