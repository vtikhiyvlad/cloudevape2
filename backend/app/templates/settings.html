{% extends "base.html" %}
{% block title %}Настройки{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Настройки</h1>

<div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 max-w-lg space-y-6">
  <div>
    <h2 class="font-semibold mb-1">Типы оплаты в кассе</h2>
    <p class="text-sm text-slate-500 mb-4">Что видит продавец при закрытии чека</p>
    <form method="post" action="/settings/payments" class="space-y-3">
      <label class="flex items-center gap-3 p-3 rounded-2xl border border-slate-100 hover:bg-slate-50">
        <input type="checkbox" name="pay_cash" {% if pay.cash %}checked{% endif %} class="w-5 h-5">
        <span>Наличные</span>
      </label>
      <label class="flex items-center gap-3 p-3 rounded-2xl border border-slate-100 hover:bg-slate-50">
        <input type="checkbox" name="pay_card" {% if pay.card %}checked{% endif %} class="w-5 h-5">
        <span>Карта</span>
      </label>
      <label class="flex items-center gap-3 p-3 rounded-2xl border border-slate-100 hover:bg-slate-50">
        <input type="checkbox" name="pay_combo" {% if pay.combo %}checked{% endif %} class="w-5 h-5">
        <span>Комбо (нал + карта)</span>
      </label>
      <button class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-sm font-medium">Сохранить</button>
    </form>
  </div>
</div>
{% endblock %}
