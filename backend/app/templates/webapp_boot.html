<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudVape</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-sm w-full">
        <div class="text-2xl font-bold mb-2">CloudVape</div>
        <p class="text-slate-400 text-sm mb-6" id="status">Подключение к Telegram…</p>
        <div class="w-8 h-8 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin mx-auto" id="spin"></div>
        <p class="text-red-400 text-sm mt-6 hidden whitespace-pre-wrap" id="err"></p>
        <button type="button" id="retry" class="hidden mt-4 bg-indigo-600 px-4 py-2 rounded-xl text-sm">Повторить</button>
    </div>

    <script>
        const dest = {{ dest | tojson }};

        function $(id) { return document.getElementById(id); }

        function showErr(msg) {
            $('status').textContent = 'Не удалось войти';
            $('spin').classList.add('hidden');
            $('err').textContent = msg;
            $('err').classList.remove('hidden');
            $('retry').classList.remove('hidden');
        }

        function loadTelegramScript() {
            return new Promise((resolve, reject) => {
                if (window.Telegram && window.Telegram.WebApp) {
                    resolve(window.Telegram.WebApp);
                    return;
                }
                const s = document.createElement('script');
                s.src = 'https://telegram.org/js/telegram-web-app.js';
                s.async = true;
                s.onload = () => {
                    if (window.Telegram && window.Telegram.WebApp) {
                        resolve(window.Telegram.WebApp);
                    } else {
                        reject(new Error('Telegram.WebApp не загрузился'));
                    }
                };
                s.onerror = () => reject(new Error('Не удалось загрузить telegram-web-app.js'));
                document.head.appendChild(s);
            });
        }

        function waitInitData(tg, timeoutMs) {
            return new Promise((resolve) => {
                const start = Date.now();
                const tick = () => {
                    try { tg.ready(); } catch (e) {}
                    if (tg.initData && tg.initData.length > 10) {
                        resolve(tg.initData);
                        return;
                    }
                    if (Date.now() - start > timeoutMs) {
                        resolve(tg.initData || '');
                        return;
                    }
                    setTimeout(tick, 100);
                };
                tick();
            });
        }

        async function boot() {
            $('err').classList.add('hidden');
            $('retry').classList.add('hidden');
            $('spin').classList.remove('hidden');
            $('status').textContent = 'Подключение к Telegram…';

            let tg;
            try {
                tg = await loadTelegramScript();
            } catch (e) {
                showErr(String(e.message || e));
                return;
            }

            try {
                tg.ready();
                tg.expand();
            } catch (e) {}

            $('status').textContent = 'Проверка сессии Telegram…';
            const initData = await waitInitData(tg, 4000);

            if (!initData || initData.length < 10) {
                const platform = (tg.platform || '?');
                const ver = (tg.version || '?');
                showErr(
                    'Telegram не передал данные входа (initData пустой).\\n\\n' +
                    'Платформа: ' + platform + ', API: ' + ver + '\\n\\n' +
                    'Проверьте:\\n' +
                    '1. Domain в @BotFather = домен Render без https\\n' +
                    '2. WEB_BASE_URL в Render = https://тот-же-домен\\n' +
                    '3. Кнопка из бота (не из меню браузера)\\n' +
                    '4. /start в боте заново после смены Domain'
                );
                return;
            }

            $('status').textContent = 'Авторизация…';
            try {
                const res = await fetch('/auth/telegram-webapp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ init_data: initData, dest: dest }),
                    credentials: 'include',
                });
                let data = {};
                try { data = await res.json(); } catch (e) {}
                if (!res.ok) {
                    throw new Error(data.detail || ('Ошибка сервера ' + res.status));
                }
                if (!data.redirect) {
                    throw new Error('Нет redirect от сервера');
                }
                $('status').textContent = 'Готово, открываем…';
                window.location.replace(data.redirect);
            } catch (e) {
                showErr(e.message || String(e));
            }
        }

        $('retry').onclick = boot;
        // старт после полной загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    </script>
</body>
</html>
