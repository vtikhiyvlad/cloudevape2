<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudVape</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-sm w-full">
        <div class="text-2xl font-bold mb-2">CloudVape</div>
        <p class="text-slate-400 text-sm mb-6" id="status">Входим через Telegram…</p>
        <div class="w-8 h-8 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin mx-auto" id="spin"></div>
        <p class="text-red-400 text-sm mt-6 hidden" id="err"></p>
        <button type="button" id="retry" class="hidden mt-4 bg-indigo-600 px-4 py-2 rounded-xl text-sm">Повторить</button>
    </div>
    <script>
        const dest = {{ dest | tojson }};
        const tg = window.Telegram && window.Telegram.WebApp;

        function showErr(msg) {
            document.getElementById('status').textContent = 'Не удалось войти';
            document.getElementById('spin').classList.add('hidden');
            const err = document.getElementById('err');
            err.textContent = msg;
            err.classList.remove('hidden');
            document.getElementById('retry').classList.remove('hidden');
        }

        async function boot() {
            if (tg) {
                tg.ready();
                try { tg.expand(); } catch (e) {}
                try { tg.setHeaderColor('#0f172a'); tg.setBackgroundColor('#0f172a'); } catch (e) {}
            }

            if (!tg || !tg.initData) {
                showErr('Открой приложение кнопкой в боте (не по ссылке из браузера).');
                return;
            }

            try {
                const res = await fetch('/auth/telegram-webapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ init_data: tg.initData, dest: dest }),
                    credentials: 'include',
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.detail || ('Ошибка ' + res.status));
                }
                if (!data.redirect) {
                    throw new Error('Сервер не вернул redirect');
                }
                document.getElementById('status').textContent = 'Успешно, открываем…';
                // Полный переход — cookie/session выставляются на GET /auth/magic
                window.location.replace(data.redirect);
            } catch (e) {
                showErr(e.message || String(e));
            }
        }

        document.getElementById('retry').onclick = () => {
            document.getElementById('err').classList.add('hidden');
            document.getElementById('retry').classList.add('hidden');
            document.getElementById('spin').classList.remove('hidden');
            document.getElementById('status').textContent = 'Входим…';
            boot();
        };
        boot();
    </script>
</body>
</html>
